[project]
name = "mental-razors"
version = "0.1.0"
description = "Reasoning linter and dashboard for Mental Razors"
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1.27,<2",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "jsonschema>=4.24,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]
